# EXP-04: Topological Dynamics of Grokking — Constrained HPC Study
#
# Drafted 2026-05-28 after the pilot. Pilot outcome was MIXED, NOT a success:
# the pre-registered PRIMARY endpoint (h0_total_persistence) was NOT supported
# (2/3 in-scope seeds), while multiple SECONDARY endpoints and the comparator
# WERE. The pilot therefore MOTIVATES this larger replication; it does not
# establish a positive result.
#
# What changes from the pilot is the DESIGN, not the hypothesis:
#   - n = 30 seeds per weight-decay condition (was 5)
#   - dense, FIXED pre-onset checkpoint schedule (fixes the sparse-window flaw:
#     the pilot's 10% pre-onset window held only n=3 checkpoints)
#   - weight-decay grid widened to 4 values
# The endpoint hierarchy is FROZEN. Do NOT promote a secondary to primary
# because the primary failed in the pilot — that is hypothesis drift. If the
# primary fails again here, under good power, that is a real negative result.

experiment:
  name: exp04_grokking_topology
  phase: full_study
  description: "Constrained HPC replication: 4 WD x 30 seeds, mod-97 addition, frozen endpoints, dense fixed checkpointing"

# --- Task --- (unchanged from pilot)
task:
  type: modular_addition
  modulus: 97
  train_fraction: 0.5  # 50/50 split

# --- Model --- (unchanged from pilot)
model:
  type: transformer_decoder
  n_layers: 1
  d_model: 128
  n_heads: 4
  dropout: 0.0

# --- Training ---
training:
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 0.03          # DEFAULT only; swept per-condition via --weight-decay (see weight_decay_grid)
  total_steps: 120000         # extended from pilot's 100K so the late-grokking tail (high WD) is captured
  batch_size: full            # full-batch training (Power et al. 2022). 1 step = 1 epoch.

# --- Weight-decay grid (the sweep dimension) ---
# Swept on the SLURM side via --weight-decay + --output-dir results/exp04_full/wd_<WD>.
# 0.01: slow/possibly-non-grokking regime within 120K — runs may have NO onset; analysis
#       must handle onset=None (see analysis_plan.no_onset_handling). Kept deliberately as
#       the slow-regime contrast.
# 1.0+ (fast/instant generalization, "no delayed grokking") is NOT included — would only be
#       added later as an explicit negative control, per design decision 2026-05-28.
weight_decay_grid: [0.01, 0.03, 0.10, 0.30]

# --- Seeds ---
# 30 fixed seeds per WD condition (120 runs total). Explicit list for reproducibility.
# Offset 2000-2029 to avoid collision with pilot seeds (42, 137, 256, 1024, 7777).
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
        2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
        2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027, 2028, 2029]

# --- Checkpoints (FIXED dense schedule, design decision 2026-05-28) ---
# Three contiguous segments in GLOBAL step-space (no onset look-ahead -> no leakage):
#   coarse  every 2,000 over [0,      30,000]   -> 16 checkpoints
#   dense   every 500   over [30,000, 90,000]   -> 121 checkpoints (30K shared)
#   coarse  every 2,000 over [90,000, 120,000]  -> 16 checkpoints (90K shared)
# Total: 151 unique checkpoints/run. Covers early AND late grokking (pilot onsets ~42-44K
# at WD=0.03; high WD groks later) at 500-step resolution without using future onset info.
# Rationale: the pilot's two-phase schedule put the fine window at 80K, too late for the
# ~42-44K onsets, leaving only n=3 points in the 10% pre-onset window.
checkpoints:
  segments:
    - {start: 0,     end: 30000,  cadence: 2000}
    - {start: 30000, end: 90000,  cadence: 500}
    - {start: 90000, end: 120000, cadence: 2000}

# --- Persistent Homology --- (unchanged from pilot; endpoints FROZEN)
topology:
  method: loss_landscape_slices
  grid_size: 50
  n_slices: 5
  direction_norm: filter

  # PRIMARY endpoint — FROZEN. Not revised despite pilot non-support.
  primary: h0_total_persistence

  # SECONDARY endpoints — FROZEN (order preserved from pilot).
  secondary:
    - h0_effective_feature_count   # IPR (sum L)^2 / sum(L^2)
    - h0_persistence_entropy
    - h0_median_persistence

  # Exploratory only (logged, never used in primary/secondary analysis)
  exploratory:
    - h0_feature_count
    - h1_feature_count
    - h1_total_persistence
    - h1_max_persistence
    - h1_persistence_entropy

  aggregation: per_slice_then_average

# --- Comparator (baseline) ---
baselines:
  local_geometry:
    - commutator_defect    # comparator signal (Dohmatob et al., 2026)
    - sharpness
  global:
    - spectral_concentration
  simple_controls:
    - weight_norm_l2
    - training_loss_curvature
    - generalization_gap
    - validation_loss_slope

# --- Grokking Onset Definition --- (unchanged from pilot)
onset:
  metric: test_accuracy
  threshold: 0.90
  condition: train_accuracy_above
  condition_threshold: 0.99
  sensitivity_thresholds: [0.80, 0.95]

# --- Evaluation --- (unchanged from pilot)
evaluation:
  pre_grokking_window_fraction: 0.10
  pre_grokking_window_sensitivity: [0.05, 0.20]
  reliability_threshold: 0.70
  changepoint:
    method: pelt
    penalty: 3.0
    robustness_method: threshold
    robustness_n_std: 2.0

# --- Analysis plan (locked 2026-05-28) ---
analysis_plan:
  # Stratify by WD FIRST, pool SECOND. Per-WD analysis is primary; pooled is secondary
  # and must account for WD as a stratum (not silently pooled across regimes).
  stratification: weight_decay_first_then_pooled
  # n=30 seeds per WD => the pre-onset directional test has real power within each stratum.
  primary_test: "directional consistency of h0_total_persistence in pre-onset window, per WD"
  # Regime / phase-structure discovery is EXPLORATORY unless it repeats across WD values.
  regime_discovery: exploratory_unless_repeats_across_wd
  # Runs with no onset (likely some/all WD=0.01) cannot contribute to the pre-onset
  # directional test. Report them separately as a no-grokking / slow regime; do NOT
  # impute an onset or drop them silently.
  no_onset_handling: report_as_separate_regime
  multiple_testing: "acknowledge secondary + WD strata exposure; report effect sizes with bootstrap CIs"

# NOTE: no `pilot_gate` block — this is the full study, not the pilot. The pilot gate
# has already been evaluated (mixed; see scripts/exp04_pilot_gate.py).
